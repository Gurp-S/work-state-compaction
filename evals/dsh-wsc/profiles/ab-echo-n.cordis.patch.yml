# B 组（实验组）：@xeyo/dsh-wsc 协作式压缩。
# 前两段与 A 组逐字相同；只有末段不同：原生 compaction-basic 关掉，
# 换成 WSC 的 wsc-config（宿主面策略服务）+ wsc-engine（压缩后端）。
# headless 不挂 preset 花名册，因此这里在 profile 层做行替换，
# 而不是让包自带的 preset-cordis 补丁生效。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: wd
    model: deepseek-v4.1-flash
    reasoningEffort: medium

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      wd:
        displayName: wd
        apiKeyEnv: WD_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8788
        models:
          - id: deepseek-v4.1-flash
            name: Deepseek-V4.1-Flash
            contextWindow: 65536
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high

- id: compaction-basic
  disabled: true

- id: wsc-config
  config:
    mode: active
    capacityMode: tokens
    # Trigger: 28235 x forceRatio 0.85 = 24,000 = ab-native's
    # thresholdRatio 0.366 x 65,536. Retain: 0.136 x 28,235 = 3,840 tokens,
    # the same as ab-native's retainTokens.
    capacityTokens: 28235
    retainRatio: 0.136
    notifyRatio: 0.8
    forceRatio: 0.85
    # No admission floor: ab-native has no equivalent, so WSC must not skip.
    minReclaimRatio: 0
    # K arm: same as J, plus the engine-side working-set section (file state
    # the model last saw) so a compaction stops forcing re-reads.
    payloadWorkingset: false
    # 状态叙述臂：由压缩模型写一段自然语言状态（已定/未完成/不确定），
    # 取代文件正文工作集。
    payloadStateNarrative: true
    payloadStateCap: 900
    payloadWorkingsetVersion: 2
    payloadWorkingsetFiles: 6
    payloadWorkingsetItemCap: 700
    payloadWorkingsetSectionCap: 2500
    selection: selective
    # 修复臂：控制段不再按 800 字节截断任务书；选材请求输出预算翻倍。
    controlItemCap: 4000
    selectionMaxTokens: 16384

- insert:
    - id: wsc-engine
      name: "@xeyo/dsh-wsc/engine"

- insert:
    - id: wsc-probe
      name: "file:///D:/lea/XenYon%20code/dsh-wsc/experiments/tools/probe.js"

